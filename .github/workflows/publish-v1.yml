name: Publish Tandem v1.0.0

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build and publish v1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tandem-v1.0.0-installable-debug.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tandem-v1.0.0-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and v1.0.0 tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: Tandem v1.0.0
          generate_release_notes: true
          body: |
            First automated Tandem release.

            **Install:** Download `Tandem-v1.0.0-installable-debug.apk` and install it on your Android device. This is a debug-signed build intended for testing.
          files: Tandem-v1.0.0-installable-debug.apk
