name: Publish Tandem Android release

on:
  push:
    branches:
      - release/v1.1.0
      - release/v1.2.0

permissions:
  contents: write

concurrency:
  group: tandem-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate version and build APKs
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts
          gradle --no-daemon assembleDebug assembleRelease
          cp app/build/outputs/apk/debug/app-debug.apk "Tandem-${VERSION}-installable-debug.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tandem-${{ github.ref_name }}-apks
          path: |
            Tandem-*-installable-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.ref_name == 'release/v1.1.0' && '1.1.0' || '1.2.0' }}
          target_commitish: ${{ github.sha }}
          name: Tandem ${{ github.ref_name == 'release/v1.1.0' && '1.1.0' || '1.2.0' }}
          generate_release_notes: true
          body: |
            Installable Android debug-signed APK for device testing.

            Download the `Tandem-*-installable-debug.apk` asset and install it on Android.
            This is a test build. The release variant is unsigned until a production signing key is configured.
          files: Tandem-*-installable-debug.apk
